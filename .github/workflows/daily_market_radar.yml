name: Daily Taiex Unified Radar

on:
  schedule:
    # 台灣時間週一至週五 17:30 執行 (UTC 09:30)
    - cron: '30 9 * * 1-5'
  workflow_dispatch: # 支援在 Actions 頁面一鍵手動觸發

jobs:
  run-radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyarrow

      - name: Run Main Radar Crawler
        run: python main_radar.py

      - name: Commit & Push Updated Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff-index --quiet HEAD || git commit -m "Auto-update market data to latest week"
          git push
