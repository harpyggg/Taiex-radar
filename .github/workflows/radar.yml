name: TMF Liquidation Radar Daily Scan

on:
  schedule:
    # 台灣時間週一至週五 下午 13:45 執行
    # (GitHub 採 UTC 時間，台灣時間減 8 小時，故 13:45 = 05:45 UTC)
    - cron: '45 5 * * 1-5'
  workflow_dispatch: # 讓您可以隨時手動按鈕測試

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Run Liquidation Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python radar.py
