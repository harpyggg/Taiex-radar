name: TXO Weekly Options Settlement Radar

on:
  schedule:
    # 台灣時間每週三與週五下午 13:45 執行
    # (GitHub 採 UTC 時間，台灣時間減 8 小時，故 13:45 = 05:45 UTC，星期三=3，星期五=5)
    - cron: '45 5 * * 3,5'
  workflow_dispatch: # 讓你可以隨時手動點擊按鈕測試

jobs:
  run-weekly-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas requests matplotlib

      - name: Run Weekly Options Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python weekly_radar.py
